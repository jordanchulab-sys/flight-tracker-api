name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Test Container
      env:
        AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
      run: |
        docker build -t flight-tracker:latest .
        docker run --rm -e AVIATIONSTACK_API_KEY="$AVIATIONSTACK_API_KEY" flight-tracker:latest