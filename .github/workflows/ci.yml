name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: flight-tracker:test

    - name: Run Application with Secret
      env:
        FLIGHT_API_KEY: ${{ secrets.FLIGHT_API_KEY }}
      run: |
        echo "Environment secret loaded securely for execution."